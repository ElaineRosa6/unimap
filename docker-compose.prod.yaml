# 生产环境 Compose 覆盖配置
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yaml up -d --build
# !override 需要 Docker Compose 2.24.4 或更高版本。

services:
  unimap:
    # 生产可直接使用已构建并固定摘要的镜像，避免运行主机依赖 Docker Hub。
    image: ${UNIMAP_IMAGE:-unimap:local}

    ports: !override
      # 仅绑定 loopback，由反向代理提供 HTTPS 公网入口
      - "127.0.0.1:8448:8448"

    volumes: !override
      # 完整替换基础卷列表，生产使用镜像内已打包的静态资源。
      # 配置目录必须可写，供 Web 设置页使用同目录临时文件和原子重命名保存。
      - unimap_config:/app/runtime-config
      - unimap_logs:/app/logs
      - unimap_data:/app/data
      - unimap_screenshots:/app/screenshots
      - unimap_chrome_profile:/app/chrome-profile
      - unimap_backups:/app/backups

    environment:
      # 生产环境强制要求固定管理令牌
      UNIMAP_ADMIN_TOKEN: ${UNIMAP_ADMIN_TOKEN:?set UNIMAP_ADMIN_TOKEN in the deployment environment}
      UNIMAP_DISTRIBUTED_ADMIN_TOKEN: ${UNIMAP_DISTRIBUTED_ADMIN_TOKEN:?set UNIMAP_DISTRIBUTED_ADMIN_TOKEN}
      UNIMAP_ADMIN_USERNAME: ${UNIMAP_ADMIN_USERNAME:?set a non-default UNIMAP_ADMIN_USERNAME}
      UNIMAP_NOTIFY_PEPPER: ${UNIMAP_NOTIFY_PEPPER:?set an independent UNIMAP_NOTIFY_PEPPER}
      UNIMAP_CONFIG_PATH: /app/runtime-config/config.yaml
      UNIMAP_CONFIG_TEMPLATE: /app/configs/config.prod.yaml
      # 试运行引擎；留空时使用已登录的 CDP Web-only 路径。
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      QUAKE_API_KEY: ${QUAKE_API_KEY:-}

    deploy:
      resources:
        limits:
          # 单机完整功能建议起点：4 vCPU / 4-6 GiB RAM
          cpus: ${UNIMAP_CPU_LIMIT:-4}
          memory: ${UNIMAP_MEMORY_LIMIT:-6G}
        reservations:
          cpus: ${UNIMAP_CPU_RESERVATION:-2}
          memory: ${UNIMAP_MEMORY_RESERVATION:-4G}

    # 日志轮转：防止日志占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # 生产环境不建议使用 restart: unless-stopped 与 deploy 同时配置；
    # Swarm/Kubernetes 模式下 deploy.restart_policy 优先。
    # Compose standalone 下 unless-stopped 仍可保留（docker-compose.yml 已有）。

volumes:
  unimap_config:
    driver: local
  unimap_logs:
    driver: local
  unimap_backups:
    driver: local
