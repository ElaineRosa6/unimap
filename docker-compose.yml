services:
  unimap:
    build:
      context: .
      args:
        UNIMAP_VERSION: ${UNIMAP_VERSION:-dev}
        UNIMAP_GIT_COMMIT: ${UNIMAP_GIT_COMMIT:-unknown}
        UNIMAP_BUILD_TIME: ${UNIMAP_BUILD_TIME:-unknown}
    ports:
      - "8448:8448"
    volumes:
      - ${UNIMAP_CONFIG_FILE:-./configs/config.docker.yaml}:/app/configs/config.yaml:ro
      - ./web:/app/web
      - ./logs:/app/logs
      - unimap_data:/app/data
      - unimap_screenshots:/app/screenshots
      - unimap_chrome_profile:/app/chrome-profile
    shm_size: 256m
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
      UNIMAP_CHROME_PATH: /usr/bin/chromium
      UNIMAP_CHROME_USER_DATA_DIR: /app/chrome-profile
      UNIMAP_DATA_DIR: /app/data
      UNIMAP_CONTAINER_BIND_ADDRESS: 0.0.0.0
      # 非 loopback 启动契约：显式 token、非默认 username、bootstrap 密码三者都必须提供，
      # 缺失时 Compose 直接报错；Web 启动 preflight 还会二次校验（username != "admin"）。
      UNIMAP_ADMIN_TOKEN: ${UNIMAP_ADMIN_TOKEN:?set UNIMAP_ADMIN_TOKEN in the deployment environment}
      UNIMAP_ADMIN_USERNAME: ${UNIMAP_ADMIN_USERNAME:?set a non-default UNIMAP_ADMIN_USERNAME}
      UNIMAP_BOOTSTRAP_PASSWORD: ${UNIMAP_BOOTSTRAP_PASSWORD:?set UNIMAP_BOOTSTRAP_PASSWORD in the deployment environment}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8448/health/ready >/dev/null 2>&1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  smtp-relay:
    # UniMap webhook -> SMTP email relay (independent container, python:3-slim).
    # Config lives in ./smtp-relay/.env (chmod 600, gitignored) — nothing is
    # hard-coded. UniMap reaches it over the compose network at
    # http://smtp-relay:8099/webhook (needs allow_private_ip=true on the channel).
    build: ./smtp-relay
    container_name: unimap-smtp-relay
    restart: unless-stopped
    env_file: ./smtp-relay/.env
    volumes:
      # 只读共享查询导出目录，供 webhook 把 Excel 文件作为邮件附件转发
      - unimap_data:/app/data:ro
    ports:
      # loopback only: for curl verification on the host. Not exposed publicly.
      - "127.0.0.1:8099:8099"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：添加NGINX作为反向代理
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - unimap
  #   restart: unless-stopped

volumes:
  unimap_data:
  unimap_screenshots:
  unimap_chrome_profile:
