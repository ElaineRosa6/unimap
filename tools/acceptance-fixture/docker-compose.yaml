# UniMap Cloud Security Acceptance Fixture
# Deploys the controlled test environment for DNS rebinding and tamper evidence
# live E2E validation.
#
# Prerequisites:
#   - Two domains (or subdomains) pointing to this server's public IP.
#   - A Cloudflare API token with Zone.DNS edit permission.
#   - Fill in .env from .env.example.
#
# Usage:
#   docker compose up -d
#
services:
  fixture:
    build:
      context: ../../
      dockerfile: tools/acceptance-fixture/Dockerfile
    restart: unless-stopped
    environment:
      FIXTURE_CONTROL_TOKEN: ${FIXTURE_CONTROL_TOKEN}
      FIXTURE_CONTROL_ADDR: ":9090"
      FIXTURE_TARGET_ADDR: ":8081"
      FIXTURE_MUTABLE_ADDR: ":8082"
      FIXTURE_SINK_ADDR: ":8083"
      FIXTURE_PUBLIC_IP: ${FIXTURE_PUBLIC_IP}
      FIXTURE_PRIVATE_IP: ${FIXTURE_PRIVATE_IP:-127.0.0.1}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_RECORD_NAME: ${CLOUDFLARE_RECORD_NAME}
    expose:
      - "8081"
      - "8082"
      - "8083"
      - "9090"
    networks:
      - fixture-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fixture-net
    depends_on:
      fixture:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  fixture-net:
