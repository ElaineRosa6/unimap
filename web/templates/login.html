<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UniMap</title>
	<link rel="stylesheet" href="/static/css/style.css?v={{.staticVersion}}">
	<link rel="stylesheet" href="/static/css/utils.css?v={{.staticVersion}}">
</head>
<body class="login-page">
	<!-- Background layers -->
	<div class="login-bg" aria-hidden="true">
		<div class="login-bg__grid"></div>
		<div class="login-bg__noise"></div>
		<div class="login-bg__glow"></div>
	</div>

	<div class="login-wrapper">
		<!-- Left branding panel -->
		<div class="login-brand">
			<div class="login-brand__inner">
				<div class="login-logo">
					<span class="login-logo__mark">U</span>
					<span class="login-logo__text">UniMap</span>
				</div>
				<p class="login-tagline">多引擎网络资产查询平台</p>
				<div class="login-engines">
					<span class="login-engines__label">引擎</span>
					<div class="login-engines__list">
						<span class="login-engines__chip">FOFA</span>
						<span class="login-engines__chip">Hunter</span>
						<span class="login-engines__chip">ZoomEye</span>
						<span class="login-engines__chip">Quake</span>
						<span class="login-engines__chip">Shodan</span>
					</div>
				</div>
			</div>
		</div>

		<!-- Right form panel -->
		<div class="login-panel">
			<div class="login-card">
				<header class="login-header">
					<h1>登录</h1>
					<p class="login-sub">输入凭证以访问控制台</p>
				</header>
				<div id="login-success" class="login-success hidden-init"></div>
				<form id="login-form" autocomplete="off">
					<!-- Hidden decoy fields to defeat Chrome autofill -->
					<input type="text" name="prevent_autofill_username" class="hidden-init" tabindex="-1" autocomplete="username">
					<input type="password" name="prevent_autofill_password" class="hidden-init" tabindex="-1" autocomplete="current-password">
					<div class="field">
						<label for="username">用户名</label>
						<input type="text" id="username" name="username" autocomplete="off" placeholder="admin" required autofocus>
					</div>
					<div class="field">
						<label for="password">密码</label>
						<input type="password" id="password" name="password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
					</div>
						<div id="login-error" class="login-error hidden-init"></div>
					<button type="submit" id="login-btn" class="btn btn-primary">
						<span class="btn__text">登录</span>
						<span class="btn__spinner hidden-init" aria-hidden="true"></span>
					</button>
				</form>
			</div>

			{{if .RegistrationOpen}}
			<div class="login-card login-card--register">
				<header class="login-header">
					<h1>创建管理员</h1>
					<p class="login-sub">检测到首次启动，请先创建管理员账号（仅本机可注册）</p>
				</header>
				<form id="register-form" autocomplete="off">
					<div class="field">
						<label for="reg-username">用户名</label>
						<input type="text" id="reg-username" name="username" autocomplete="off" minlength="3" maxlength="32" placeholder="3-32 个字符" required>
					</div>
					<div class="field">
						<label for="reg-password">密码</label>
						<input type="password" id="reg-password" name="password" autocomplete="new-password" minlength="8" placeholder="至少 8 个字符" required>
					</div>
					<div class="field">
						<label for="reg-password2">确认密码</label>
						<input type="password" id="reg-password2" autocomplete="new-password" required>
					</div>
					<div id="register-error" class="login-error hidden-init"></div>
					<button type="submit" id="register-btn" class="btn btn-primary">
						<span class="btn__text">创建管理员</span>
						<span class="btn__spinner hidden-init" aria-hidden="true"></span>
					</button>
				</form>
			</div>
			{{end}}

			<p class="login-footer">UniMap &copy; 2026</p>
		</div>
	</div>

	<script nonce="{{.CSPNonce}}">
	(function() {
		function getCookie(name) {
			var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
			return match ? decodeURIComponent(match[2]) : '';
		}

		function show(el, text) {
			el.textContent = text || '';
			el.style.display = 'block';
		}

		function hide(el) {
			el.style.display = 'none';
		}

		function setBusy(btn, busy) {
			var text = btn.querySelector('.btn__text');
			var spinner = btn.querySelector('.btn__spinner');
			btn.disabled = busy;
			if (text) text.style.display = busy ? 'none' : 'inline';
			if (spinner) spinner.style.display = busy ? 'inline-block' : 'none';
		}

		// 注册成功提示：/login?registered=1
		if (new URLSearchParams(window.location.search).get('registered') === '1') {
			show(document.getElementById('login-success'), '管理员创建成功，请使用新账号登录');
		}

		document.getElementById('login-form').addEventListener('submit', async function(e) {
			e.preventDefault();
			var btn = document.getElementById('login-btn');
			var errDiv = document.getElementById('login-error');
			var username = document.getElementById('username').value.trim();
			var password = document.getElementById('password').value;
			var csrfToken = getCookie('unimap_csrf');

			if (!username || !password) {
				show(errDiv, '请输入用户名和密码');
				return;
			}

			setBusy(btn, true);
			hide(errDiv);

			try {
				var resp = await fetch('/api/v1/login', {
					method: 'POST',
					headers: {'Content-Type': 'application/x-www-form-urlencoded'},
					body: new URLSearchParams({
						username: username,
						password: password,
						csrf_token: csrfToken
					})
				});
				var data = await resp.json();
				if (resp.ok && data.success) {
					window.location.href = data.redirect || '/';
				} else {
					show(errDiv, data.error || '登录失败');
				}
			} catch (err) {
				show(errDiv, '网络错误，请重试');
			} finally {
				setBusy(btn, false);
			}
		});

		var registerForm = document.getElementById('register-form');
		if (registerForm) {
			registerForm.addEventListener('submit', async function(e) {
				e.preventDefault();
				var btn = document.getElementById('register-btn');
				var errDiv = document.getElementById('register-error');
				var username = document.getElementById('reg-username').value.trim();
				var password = document.getElementById('reg-password').value;
				var password2 = document.getElementById('reg-password2').value;

				if (username.length < 3 || username.length > 32) {
					show(errDiv, '用户名长度需为 3-32 个字符');
					return;
				}
				if (password.length < 8) {
					show(errDiv, '密码至少需要 8 个字符');
					return;
				}
				if (password !== password2) {
					show(errDiv, '两次输入的密码不一致');
					return;
				}

				setBusy(btn, true);
				hide(errDiv);

				try {
					var resp = await fetch('/api/v1/users/register', {
						method: 'POST',
						headers: {'Content-Type': 'application/json'},
						body: JSON.stringify({username: username, password: password})
					});
					var data = await resp.json();
					if (resp.ok && data.success) {
						window.location.href = '/login?registered=1';
					} else {
						show(errDiv, (data && (data.error || data.message)) || '注册失败，请重试');
					}
				} catch (err) {
					show(errDiv, '网络错误，请重试');
				} finally {
					setBusy(btn, false);
				}
			});
		}
	})();
	</script>
</body>
</html>
